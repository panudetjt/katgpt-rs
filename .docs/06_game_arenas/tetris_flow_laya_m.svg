<svg xmlns="http://www.w3.org/2000/svg" id="tetris-flow-laya-m" data-gfflow="1" viewBox="0 0 340 768" width="340" height="768" role="img" aria-labelledby="tetris-flow-laya-m-t tetris-flow-laya-m-d">
<title id="tetris-flow-laya-m-t">laya (Rust + Python): the model reads every landing spot</title>
<desc id="tetris-flow-laya-m-d">6 steps in path order. 1. The turn arrives: board plus falling piece from the seeded 7-bag (the game; live). 2. List every spot: each rotation in each column — the futures to judge (the harness; live). 3. Say it in words: holes, surface, side, height — one sentence per spot (the harness; live). 4. The model reads: a laya forward pass per sentence (the model; live). 5. P(clean) per spot: a cleanliness probability for every landing (the model; live). 6. Play the highest: the top spot drops; the next turn begins (the game; live).</desc>
<style>#tetris-flow-laya-m .k{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}#tetris-flow-laya-m .t{font:700 15.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#tetris-flow-laya-m .d{font:400 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#tetris-flow-laya-m .n{font:700 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#tetris-flow-laya-m .s{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#tetris-flow-laya-m .el{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab}#tetris-flow-laya-m .e{fill:none;stroke-width:1.6}</style>
<defs><marker id="tetris-flow-laya-m-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="340" height="768" rx="14" fill="#11141b"/>
<g data-step="turn" data-n="1"><rect class="gf-cb" x="4" y="8" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="20" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="30" class="k" fill="#ff8a3d">THE GAME</text><circle cx="280.2" cy="26" r="3.5" fill="#4ade80"/><text x="318" y="30" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="51" r="11" fill="#ff8a3d"/><text x="33" y="55.5" text-anchor="middle" class="n">1</text><text x="54" y="56" class="t">The turn arrives</text><text x="22" y="80" class="d">board plus falling piece from the seeded 7-bag</text></g>
<g data-edge="turn->list"><path class="e" d="M44,94 V134" stroke="#69718a" marker-end="url(#tetris-flow-laya-m-a0)"/>
</g>
<g data-step="list" data-n="2"><rect class="gf-cb" x="4" y="134" width="332" height="104" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="146" width="4" height="80" rx="2" fill="#ff8a3d"/><text x="22" y="156" class="k" fill="#ff8a3d">THE HARNESS</text><circle cx="280.2" cy="152" r="3.5" fill="#4ade80"/><text x="318" y="156" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="177" r="11" fill="#ff8a3d"/><text x="33" y="181.5" text-anchor="middle" class="n">2</text><text x="54" y="182" class="t">List every spot</text><text x="22" y="206" class="d">each rotation in each column — the futures to</text><text x="22" y="224" class="d">judge</text></g>
<g data-edge="list->write"><path class="e" d="M44,238 V278" stroke="#69718a" marker-end="url(#tetris-flow-laya-m-a0)"/>
</g>
<g data-step="write" data-n="3"><rect class="gf-cb" x="4" y="278" width="332" height="104" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="290" width="4" height="80" rx="2" fill="#ff8a3d"/><text x="22" y="300" class="k" fill="#ff8a3d">THE HARNESS</text><circle cx="280.2" cy="296" r="3.5" fill="#4ade80"/><text x="318" y="300" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="321" r="11" fill="#ff8a3d"/><text x="33" y="325.5" text-anchor="middle" class="n">3</text><text x="54" y="326" class="t">Say it in words</text><text x="22" y="350" class="d">holes, surface, side, height — one sentence</text><text x="22" y="368" class="d">per spot</text></g>
<g data-edge="write->read"><path class="e" d="M44,382 V422" stroke="#69718a" marker-end="url(#tetris-flow-laya-m-a0)"/>
</g>
<g data-step="read" data-n="4"><rect class="gf-cb" x="4" y="422" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="434" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="444" class="k" fill="#ff8a3d">THE MODEL</text><circle cx="280.2" cy="440" r="3.5" fill="#4ade80"/><text x="318" y="444" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="465" r="11" fill="#ff8a3d"/><text x="33" y="469.5" text-anchor="middle" class="n">4</text><text x="54" y="470" class="t">The model reads</text><text x="22" y="494" class="d">a laya forward pass per sentence</text></g>
<g data-edge="read->pclean"><path class="e" d="M44,508 V548" stroke="#69718a" marker-end="url(#tetris-flow-laya-m-a0)"/>
</g>
<g data-step="pclean" data-n="5"><rect class="gf-cb" x="4" y="548" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="560" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="570" class="k" fill="#ff8a3d">THE MODEL</text><circle cx="280.2" cy="566" r="3.5" fill="#4ade80"/><text x="318" y="570" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="591" r="11" fill="#ff8a3d"/><text x="33" y="595.5" text-anchor="middle" class="n">5</text><text x="54" y="596" class="t">P(clean) per spot</text><text x="22" y="620" class="d">a cleanliness probability for every landing</text></g>
<g data-edge="pclean->play"><path class="e" d="M44,634 V674" stroke="#69718a" marker-end="url(#tetris-flow-laya-m-a0)"/>
</g>
<g data-step="play" data-n="6"><rect class="gf-cb" x="4" y="674" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="686" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="696" class="k" fill="#ff8a3d">THE GAME</text><circle cx="280.2" cy="692" r="3.5" fill="#4ade80"/><text x="318" y="696" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="717" r="11" fill="#ff8a3d"/><text x="33" y="721.5" text-anchor="middle" class="n">6</text><text x="54" y="722" class="t">Play the highest</text><text x="22" y="746" class="d">the top spot drops; the next turn begins</text></g>
</svg>
