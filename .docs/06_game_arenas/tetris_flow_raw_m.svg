<svg xmlns="http://www.w3.org/2000/svg" id="tetris-flow-raw-m" data-gfflow="1" viewBox="0 0 340 548" width="340" height="548" role="img" aria-labelledby="tetris-flow-raw-m-t tetris-flow-raw-m-d">
<title id="tetris-flow-raw-m-t">raw baseline: the engine with its heads removed — the honest floor</title>
<desc id="tetris-flow-raw-m-d">4 steps in path order. 1. The same sentence: the spot sentence, sent to the bare engine (the sentence; live). 2. Corpus engine: no fitted heads — nearest corpus neighbours only (the engine; live). 3a. In corpus → play: a known shape: the highest neighbour wins (the engine; live). 3b. Abstain → random: no close neighbour: a labelled random spot plays (the floor; live).</desc>
<style>#tetris-flow-raw-m .k{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}#tetris-flow-raw-m .t{font:700 15.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#tetris-flow-raw-m .d{font:400 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#tetris-flow-raw-m .n{font:700 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#tetris-flow-raw-m .s{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#tetris-flow-raw-m .el{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab}#tetris-flow-raw-m .e{fill:none;stroke-width:1.6}</style>
<defs><marker id="tetris-flow-raw-m-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="340" height="548" rx="14" fill="#11141b"/>
<g data-step="sentence" data-n="1"><rect class="gf-cb" x="4" y="8" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="20" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="30" class="k" fill="#ff8a3d">THE SENTENCE · UNCHANGED</text><circle cx="280.2" cy="26" r="3.5" fill="#4ade80"/><text x="318" y="30" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="51" r="11" fill="#ff8a3d"/><text x="33" y="55.5" text-anchor="middle" class="n">1</text><text x="54" y="56" class="t">The same sentence</text><text x="22" y="80" class="d">the spot sentence, sent to the bare engine</text></g>
<g data-edge="sentence->engine"><path class="e" d="M44,94 V134" stroke="#69718a" marker-end="url(#tetris-flow-raw-m-a0)"/>
</g>
<g data-step="engine" data-n="2"><rect class="gf-cb" x="4" y="134" width="332" height="136" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="146" width="4" height="112" rx="2" fill="#ff8a3d"/><text x="22" y="156" class="k" fill="#ff8a3d">THE ENGINE · NO FITTED HEADS</text><circle cx="280.2" cy="152" r="3.5" fill="#4ade80"/><text x="318" y="156" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="177" r="11" fill="#ff8a3d"/><text x="33" y="181.5" text-anchor="middle" class="n">2</text><text x="54" y="182" class="t">Corpus engine</text><text x="22" y="206" class="d">no fitted heads — nearest corpus neighbours</text><text x="22" y="224" class="d">only</text><rect x="22" y="236" width="49.6" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="30" y="250" class="el">→ 3a</text><rect x="77.6" y="236" width="49.6" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="85.6" y="250" class="el">→ 3b</text></g>
<g data-edge="engine->play"><path class="e" d="M44,270 V310" stroke="#69718a" marker-end="url(#tetris-flow-raw-m-a0)"/>
</g>
<g data-step="play" data-n="3a"><rect class="gf-cb" x="4" y="310" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="322" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="332" class="k" fill="#ff8a3d">THE ENGINE · NO FITTED HEADS</text><circle cx="280.2" cy="328" r="3.5" fill="#4ade80"/><text x="318" y="332" text-anchor="end" class="s" fill="#4ade80">live</text><rect x="22" y="342" width="29.6" height="22" rx="11" fill="#ff8a3d"/><text x="36.8" y="357.5" text-anchor="middle" class="n">3a</text><text x="61.6" y="358" class="t">In corpus → play</text><text x="22" y="382" class="d">a known shape: the highest neighbour wins</text></g>
<g data-edge="engine->abstain"><path class="e" d="M44,402 V430" stroke="#69718a" stroke-dasharray="3 4"/><text class="el" x="56" y="420">↳ from 2</text></g>
<g data-step="abstain" data-n="3b"><rect class="gf-cb" x="4" y="436" width="332" height="104" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="448" width="4" height="80" rx="2" fill="#ff8a3d"/><text x="22" y="458" class="k" fill="#ff8a3d">THE FLOOR · THE HONEST FLOOR</text><circle cx="280.2" cy="454" r="3.5" fill="#4ade80"/><text x="318" y="458" text-anchor="end" class="s" fill="#4ade80">live</text><rect x="22" y="468" width="30.4" height="22" rx="11" fill="#ff8a3d"/><text x="37.2" y="483.5" text-anchor="middle" class="n">3b</text><text x="62.4" y="484" class="t">Abstain → random</text><text x="22" y="508" class="d">no close neighbour: a labelled random spot</text><text x="22" y="526" class="d">plays</text></g>
</svg>
