<svg xmlns="http://www.w3.org/2000/svg" id="tetris-flow-modes-m" data-gfflow="1" viewBox="0 0 340 538" width="340" height="538" role="img" aria-labelledby="tetris-flow-modes-m-t tetris-flow-modes-m-d">
<title id="tetris-flow-modes-m-t">The rulebook&#x27;s modes: build for tetrises, dig or survive in trouble</title>
<desc id="tetris-flow-modes-m-d">3 steps in path order. 1. BUILD: nine flat + one open well; wait for tetrises (build; live). 2a. If 3+ holes: DOWNSTACK: covered holes — dig them back out first (trouble; live). 2b. If 12+ rows: SURVIVE: a tall stack — take any line, stay low (trouble; live). From 2a back to 1: holes dug out. From 2b back to 1: back under 12.</desc>
<style>#tetris-flow-modes-m .k{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}#tetris-flow-modes-m .t{font:700 15.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#tetris-flow-modes-m .d{font:400 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#tetris-flow-modes-m .n{font:700 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#tetris-flow-modes-m .s{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#tetris-flow-modes-m .el{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab}#tetris-flow-modes-m .e{fill:none;stroke-width:1.6}</style>
<defs><marker id="tetris-flow-modes-m-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="340" height="538" rx="14" fill="#11141b"/>
<g data-step="bu" data-n="1"><rect class="gf-cb" x="4" y="8" width="332" height="118" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="20" width="4" height="94" rx="2" fill="#ff8a3d"/><text x="22" y="30" class="k" fill="#ff8a3d">BUILD</text><circle cx="280.2" cy="26" r="3.5" fill="#4ade80"/><text x="318" y="30" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="51" r="11" fill="#ff8a3d"/><text x="33" y="55.5" text-anchor="middle" class="n">1</text><text x="54" y="56" class="t">BUILD</text><text x="22" y="80" class="d">nine flat + one open well; wait for tetrises</text><rect x="22" y="92" width="133.6" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="30" y="106" class="el">→ 2a · 3+ holes</text><rect x="161.6" y="92" width="133.6" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="169.6" y="106" class="el">→ 2b · 12+ rows</text></g>
<g data-edge="bu->ds"><path class="e" d="M44,126 V166" stroke="#69718a" marker-end="url(#tetris-flow-modes-m-a0)"/>
<text class="el" x="56" y="150">3+ holes</text>
</g>
<g data-step="ds" data-n="2a"><rect class="gf-cb" x="4" y="166" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="178" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="188" class="k" fill="#ff8a3d">TROUBLE</text><circle cx="280.2" cy="184" r="3.5" fill="#4ade80"/><text x="318" y="188" text-anchor="end" class="s" fill="#4ade80">live</text><rect x="22" y="198" width="29.6" height="22" rx="11" fill="#ff8a3d"/><text x="36.8" y="213.5" text-anchor="middle" class="n">2a</text><text x="61.6" y="214" class="t">DOWNSTACK</text><text x="22" y="238" class="d">covered holes — dig them back out first</text></g>
<g data-edge="bu->sv"><path class="e" d="M44,258 V286" stroke="#69718a" stroke-dasharray="3 4"/><text class="el" x="56" y="276">↳ from 1 · 12+ rows</text></g>
<g data-step="sv" data-n="2b"><rect class="gf-cb" x="4" y="292" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="304" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="314" class="k" fill="#ff8a3d">TROUBLE</text><circle cx="280.2" cy="310" r="3.5" fill="#4ade80"/><text x="318" y="314" text-anchor="end" class="s" fill="#4ade80">live</text><rect x="22" y="324" width="30.4" height="22" rx="11" fill="#ff8a3d"/><text x="37.2" y="339.5" text-anchor="middle" class="n">2b</text><text x="62.4" y="340" class="t">SURVIVE</text><text x="22" y="364" class="d">a tall stack — take any line, stay low</text></g>
<g data-edge="ds->bu"><rect x="4" y="396" width="332" height="58" rx="12" fill="#ff8a3d" fill-opacity=".08" stroke="#ff8a3d" stroke-opacity=".5" stroke-dasharray="4 4"/><text x="22" y="422" class="el" style="fill:#ff8a3d">↺ from 2a back to step 1 · holes dug</text><text x="22" y="440" class="el" style="fill:#ff8a3d">out</text></g>
<g data-edge="sv->bu"><rect x="4" y="472" width="332" height="58" rx="12" fill="#ff8a3d" fill-opacity=".08" stroke="#ff8a3d" stroke-opacity=".5" stroke-dasharray="4 4"/><text x="22" y="498" class="el" style="fill:#ff8a3d">↺ from 2b back to step 1 · back under</text><text x="22" y="516" class="el" style="fill:#ff8a3d">12</text></g>
</svg>
