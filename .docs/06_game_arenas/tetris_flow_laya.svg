<svg xmlns="http://www.w3.org/2000/svg" id="tetris-flow-laya" data-gfflow="1" viewBox="0 0 1168 546" width="1168" height="546" role="img" aria-labelledby="tetris-flow-laya-t tetris-flow-laya-d">
<title id="tetris-flow-laya-t">laya (Rust + Python): the model reads every landing spot</title>
<desc id="tetris-flow-laya-d">6 steps in path order. 1. The turn arrives: board plus falling piece from the seeded 7-bag (the game; live). 2. List every spot: each rotation in each column — the futures to judge (the harness; live). 3. Say it in words: holes, surface, side, height — one sentence per spot (the harness; live). 4. The model reads: a laya forward pass per sentence (the model; live). 5. P(clean) per spot: a cleanliness probability for every landing (the model; live). 6. Play the highest: the top spot drops; the next turn begins (the game; live).</desc>
<style>#tetris-flow-laya .lh{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}#tetris-flow-laya .ln{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#9299ab}#tetris-flow-laya .at{font:600 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#tetris-flow-laya .t{font:700 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#tetris-flow-laya .d{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#tetris-flow-laya .n{font:700 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#tetris-flow-laya .s{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#tetris-flow-laya .el{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab;paint-order:stroke;stroke:#11141b;stroke-width:4px;stroke-linejoin:round}#tetris-flow-laya .e{fill:none;stroke-width:1.6}#tetris-flow-laya .eb{fill:none;stroke-width:2}</style>
<defs><marker id="tetris-flow-laya-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="1168" height="546" rx="14" fill="#11141b"/>
<g data-lane="game"><rect x="10" y="12" width="1148" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="37"><tspan class="lh" fill="#ff8a3d">THE GAME</tspan><tspan class="ln" dx="12">seeded 7-bag · hard drop</tspan></text></g>
<g data-lane="code"><rect x="10" y="190" width="1148" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="215"><tspan class="lh" fill="#ff8a3d">THE HARNESS</tspan><tspan class="ln" dx="12">enumerates + writes</tspan></text></g>
<g data-lane="model"><rect x="10" y="368" width="1148" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="393"><tspan class="lh" fill="#ff8a3d">THE MODEL</tspan><tspan class="ln" dx="12">open weights · Rust or Python</tspan></text></g>
<g data-edge="turn->list"><path class="e" d="M260,108 439,108 439,232" stroke="#69718a" marker-end="url(#tetris-flow-laya-a0)"/></g>
<g data-edge="list->write"><path class="e" d="M554,286 618,286" stroke="#69718a" marker-end="url(#tetris-flow-laya-a0)"/></g>
<g data-edge="write->read"><path class="e" d="M733,340 733,410" stroke="#69718a" marker-end="url(#tetris-flow-laya-a0)"/></g>
<g data-edge="read->pclean"><path class="e" d="M848,464 912,464" stroke="#69718a" marker-end="url(#tetris-flow-laya-a0)"/></g>
<g data-edge="pclean->play"><path class="e" d="M1027,410 1027,162" stroke="#69718a" marker-end="url(#tetris-flow-laya-a0)"/></g>
<g data-step="turn" data-n="1"><rect class="gf-cb" x="30" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="52" cy="78" r="12" fill="#ff8a3d"/><text x="52" y="82.5" text-anchor="middle" class="n">1</text><text x="74" y="83" class="t">The turn arrives</text><text x="46" y="109" class="d">board plus falling piece from</text><text x="46" y="128" class="d">the seeded 7-bag</text><circle cx="50" cy="146" r="4" fill="#4ade80"/><text x="60" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="list" data-n="2"><rect class="gf-cb" x="324" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="346" cy="256" r="12" fill="#ff8a3d"/><text x="346" y="260.5" text-anchor="middle" class="n">2</text><text x="368" y="261" class="t">List every spot</text><text x="340" y="287" class="d">each rotation in each column</text><text x="340" y="306" class="d">— the futures to judge</text><circle cx="344" cy="324" r="4" fill="#4ade80"/><text x="354" y="328" class="s" fill="#4ade80">live</text></g>
<g data-step="write" data-n="3"><rect class="gf-cb" x="618" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="640" cy="256" r="12" fill="#ff8a3d"/><text x="640" y="260.5" text-anchor="middle" class="n">3</text><text x="662" y="261" class="t">Say it in words</text><text x="634" y="287" class="d">holes, surface, side, height —</text><text x="634" y="306" class="d">one sentence per spot</text><circle cx="638" cy="324" r="4" fill="#4ade80"/><text x="648" y="328" class="s" fill="#4ade80">live</text></g>
<g data-step="read" data-n="4"><rect class="gf-cb" x="618" y="410" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="640" cy="434" r="12" fill="#ff8a3d"/><text x="640" y="438.5" text-anchor="middle" class="n">4</text><text x="662" y="439" class="t">The model reads</text><text x="634" y="465" class="d">a laya forward pass per</text><text x="634" y="484" class="d">sentence</text><circle cx="638" cy="502" r="4" fill="#4ade80"/><text x="648" y="506" class="s" fill="#4ade80">live</text></g>
<g data-step="pclean" data-n="5"><rect class="gf-cb" x="912" y="410" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="934" cy="434" r="12" fill="#ff8a3d"/><text x="934" y="438.5" text-anchor="middle" class="n">5</text><text x="956" y="439" class="t">P(clean) per spot</text><text x="928" y="465" class="d">a cleanliness probability for</text><text x="928" y="484" class="d">every landing</text><circle cx="932" cy="502" r="4" fill="#4ade80"/><text x="942" y="506" class="s" fill="#4ade80">live</text></g>
<g data-step="play" data-n="6"><rect class="gf-cb" x="912" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="934" cy="78" r="12" fill="#ff8a3d"/><text x="934" y="82.5" text-anchor="middle" class="n">6</text><text x="956" y="83" class="t">Play the highest</text><text x="928" y="109" class="d">the top spot drops; the next</text><text x="928" y="128" class="d">turn begins</text><circle cx="932" cy="146" r="4" fill="#4ade80"/><text x="942" y="150" class="s" fill="#4ade80">live</text></g>
</svg>
