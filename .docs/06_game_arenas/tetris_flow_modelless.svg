<svg xmlns="http://www.w3.org/2000/svg" id="tetris-flow-modelless" data-gfflow="1" viewBox="0 0 1168 546" width="1168" height="546" role="img" aria-labelledby="tetris-flow-modelless-t tetris-flow-modelless-d">
<title id="tetris-flow-modelless-t">Reflex · modelless: laya&#x27;s answers distilled into a µs head</title>
<desc id="tetris-flow-modelless-d">4 steps in path order. 1. The same sentence: the spot sentence laya reads, unchanged (the sentence; live). 2. Decode to features: holes · flat · height · side · clears, as numbers (the decode; live). 3. A tiny linear head: fitted on laya&#x27;s recorded answers — no model runs (the head; live). 4. Play the highest: microseconds in your tab; the top spot drops (the head; live).</desc>
<style>#tetris-flow-modelless .lh{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}#tetris-flow-modelless .ln{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#9299ab}#tetris-flow-modelless .at{font:600 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#tetris-flow-modelless .t{font:700 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#tetris-flow-modelless .d{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#tetris-flow-modelless .n{font:700 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#tetris-flow-modelless .s{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#tetris-flow-modelless .el{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab;paint-order:stroke;stroke:#11141b;stroke-width:4px;stroke-linejoin:round}#tetris-flow-modelless .e{fill:none;stroke-width:1.6}#tetris-flow-modelless .eb{fill:none;stroke-width:2}</style>
<defs><marker id="tetris-flow-modelless-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="1168" height="546" rx="14" fill="#11141b"/>
<g data-lane="wire"><rect x="10" y="12" width="1148" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="37"><tspan class="lh" fill="#ff8a3d">THE SENTENCE</tspan><tspan class="ln" dx="12">the same wire laya reads</tspan></text></g>
<g data-lane="decode"><rect x="10" y="190" width="1148" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="215"><tspan class="lh" fill="#ff8a3d">THE DECODE</tspan></text></g>
<g data-lane="head"><rect x="10" y="368" width="1148" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="393"><tspan class="lh" fill="#ff8a3d">THE HEAD</tspan><tspan class="ln" dx="12">WebAssembly · your tab</tspan></text></g>
<g data-edge="sentence->decode"><path class="e" d="M260,108 439,108 439,232" stroke="#69718a" marker-end="url(#tetris-flow-modelless-a0)"/></g>
<g data-edge="decode->head"><path class="e" d="M554,286 733,286 733,410" stroke="#69718a" marker-end="url(#tetris-flow-modelless-a0)"/></g>
<g data-edge="head->play"><path class="e" d="M848,464 912,464" stroke="#69718a" marker-end="url(#tetris-flow-modelless-a0)"/></g>
<g data-step="sentence" data-n="1"><rect class="gf-cb" x="30" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="52" cy="78" r="12" fill="#ff8a3d"/><text x="52" y="82.5" text-anchor="middle" class="n">1</text><text x="74" y="83" class="t">The same sentence</text><text x="46" y="109" class="d">the spot sentence laya reads,</text><text x="46" y="128" class="d">unchanged</text><circle cx="50" cy="146" r="4" fill="#4ade80"/><text x="60" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="decode" data-n="2"><rect class="gf-cb" x="324" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="346" cy="256" r="12" fill="#ff8a3d"/><text x="346" y="260.5" text-anchor="middle" class="n">2</text><text x="368" y="261" class="t">Decode to features</text><text x="340" y="287" class="d">holes · flat · height · side ·</text><text x="340" y="306" class="d">clears, as numbers</text><circle cx="344" cy="324" r="4" fill="#4ade80"/><text x="354" y="328" class="s" fill="#4ade80">live</text></g>
<g data-step="head" data-n="3"><rect class="gf-cb" x="618" y="410" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="640" cy="434" r="12" fill="#ff8a3d"/><text x="640" y="438.5" text-anchor="middle" class="n">3</text><text x="662" y="439" class="t">A tiny linear head</text><text x="634" y="465" class="d">fitted on laya&#x27;s recorded</text><text x="634" y="484" class="d">answers — no model runs</text><circle cx="638" cy="502" r="4" fill="#4ade80"/><text x="648" y="506" class="s" fill="#4ade80">live</text></g>
<g data-step="play" data-n="4"><rect class="gf-cb" x="912" y="410" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="934" cy="434" r="12" fill="#ff8a3d"/><text x="934" y="438.5" text-anchor="middle" class="n">4</text><text x="956" y="439" class="t">Play the highest</text><text x="928" y="465" class="d">microseconds in your tab; the</text><text x="928" y="484" class="d">top spot drops</text><circle cx="932" cy="502" r="4" fill="#4ade80"/><text x="942" y="506" class="s" fill="#4ade80">live</text></g>
</svg>
