<svg xmlns="http://www.w3.org/2000/svg" id="tetris-flow-modes" data-gfflow="1" viewBox="0 0 874 368" width="874" height="368" role="img" aria-labelledby="tetris-flow-modes-t tetris-flow-modes-d">
<title id="tetris-flow-modes-t">The rulebook&#x27;s modes: build for tetrises, dig or survive in trouble</title>
<desc id="tetris-flow-modes-d">3 steps in path order. 1. BUILD: nine flat + one open well; wait for tetrises (build; live). 2a. If 3+ holes: DOWNSTACK: covered holes — dig them back out first (trouble; live). 2b. If 12+ rows: SURVIVE: a tall stack — take any line, stay low (trouble; live). From 2a back to 1: holes dug out. From 2b back to 1: back under 12.</desc>
<style>#tetris-flow-modes .lh{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}#tetris-flow-modes .ln{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#9299ab}#tetris-flow-modes .at{font:600 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#tetris-flow-modes .t{font:700 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#tetris-flow-modes .d{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#tetris-flow-modes .n{font:700 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#tetris-flow-modes .s{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#tetris-flow-modes .el{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab;paint-order:stroke;stroke:#11141b;stroke-width:4px;stroke-linejoin:round}#tetris-flow-modes .e{fill:none;stroke-width:1.6}#tetris-flow-modes .eb{fill:none;stroke-width:2}</style>
<defs><marker id="tetris-flow-modes-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker><marker id="tetris-flow-modes-a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff8a3d"/></marker></defs>
<rect width="874" height="368" rx="14" fill="#11141b"/>
<g data-lane="build"><rect x="10" y="12" width="854" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="37"><tspan class="lh" fill="#ff8a3d">BUILD</tspan><tspan class="ln" dx="12">self-evolved weights</tspan></text></g>
<g data-lane="trouble"><rect x="10" y="190" width="854" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="215"><tspan class="lh" fill="#ff8a3d">TROUBLE</tspan><tspan class="ln" dx="12">proven survival weights</tspan></text></g>
<g data-edge="bu->ds"><path class="e" d="M260,81 439,81 439,232" stroke="#69718a" marker-end="url(#tetris-flow-modes-a0)"/><text class="el" x="349.5" y="72" text-anchor="middle">3+ holes</text></g>
<g data-edge="bu->sv"><path class="e" d="M260,108 694.7,108 694.7,232" stroke="#69718a" marker-end="url(#tetris-flow-modes-a0)"/><text class="el" x="477.3" y="99" text-anchor="middle">12+ rows</text></g>
<g data-edge="ds->bu"><path class="eb" d="M324,286 145,286 145,162" stroke="#ff8a3d" marker-end="url(#tetris-flow-modes-a1)"/><text class="el" x="234.5" y="277" text-anchor="middle" style="fill:#ff8a3d">holes dug out</text></g>
<g data-edge="sv->bu"><path class="eb" d="M771.3,232 771.3,135 260,135" stroke="#ff8a3d" marker-end="url(#tetris-flow-modes-a1)"/><text class="el" x="515.7" y="126" text-anchor="middle" style="fill:#ff8a3d">back under 12</text></g>
<g data-step="bu" data-n="1"><rect class="gf-cb" x="30" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="52" cy="78" r="12" fill="#ff8a3d"/><text x="52" y="82.5" text-anchor="middle" class="n">1</text><text x="74" y="83" class="t">BUILD</text><text x="46" y="109" class="d">nine flat + one open well; wait</text><text x="46" y="128" class="d">for tetrises</text><circle cx="50" cy="146" r="4" fill="#4ade80"/><text x="60" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="ds" data-n="2a"><rect class="gf-cb" x="324" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="334" y="244" width="29.6" height="24" rx="12" fill="#ff8a3d"/><text x="348.8" y="260.5" text-anchor="middle" class="n">2a</text><text x="373.6" y="261" class="t">DOWNSTACK</text><text x="340" y="287" class="d">covered holes — dig them</text><text x="340" y="306" class="d">back out first</text><circle cx="344" cy="324" r="4" fill="#4ade80"/><text x="354" y="328" class="s" fill="#4ade80">live</text></g>
<g data-step="sv" data-n="2b"><rect class="gf-cb" x="618" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="628" y="244" width="30.4" height="24" rx="12" fill="#ff8a3d"/><text x="643.2" y="260.5" text-anchor="middle" class="n">2b</text><text x="668.4" y="261" class="t">SURVIVE</text><text x="634" y="287" class="d">a tall stack — take any line,</text><text x="634" y="306" class="d">stay low</text><circle cx="638" cy="324" r="4" fill="#4ade80"/><text x="648" y="328" class="s" fill="#4ade80">live</text></g>
</svg>
