<svg xmlns="http://www.w3.org/2000/svg" id="tetris-flow-raw" data-gfflow="1" viewBox="0 0 874 546" width="874" height="546" role="img" aria-labelledby="tetris-flow-raw-t tetris-flow-raw-d">
<title id="tetris-flow-raw-t">raw baseline: the engine with its heads removed — the honest floor</title>
<desc id="tetris-flow-raw-d">4 steps in path order. 1. The same sentence: the spot sentence, sent to the bare engine (the sentence; live). 2. Corpus engine: no fitted heads — nearest corpus neighbours only (the engine; live). 3a. In corpus → play: a known shape: the highest neighbour wins (the engine; live). 3b. Abstain → random: no close neighbour: a labelled random spot plays (the floor; live).</desc>
<style>#tetris-flow-raw .lh{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}#tetris-flow-raw .ln{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#9299ab}#tetris-flow-raw .at{font:600 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#tetris-flow-raw .t{font:700 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#tetris-flow-raw .d{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#tetris-flow-raw .n{font:700 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#tetris-flow-raw .s{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#tetris-flow-raw .el{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab;paint-order:stroke;stroke:#11141b;stroke-width:4px;stroke-linejoin:round}#tetris-flow-raw .e{fill:none;stroke-width:1.6}#tetris-flow-raw .eb{fill:none;stroke-width:2}</style>
<defs><marker id="tetris-flow-raw-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="874" height="546" rx="14" fill="#11141b"/>
<g data-lane="ask"><rect x="10" y="12" width="854" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="37"><tspan class="lh" fill="#ff8a3d">THE SENTENCE</tspan><tspan class="ln" dx="12">unchanged</tspan></text></g>
<g data-lane="engine"><rect x="10" y="190" width="854" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="215"><tspan class="lh" fill="#ff8a3d">THE ENGINE</tspan><tspan class="ln" dx="12">no fitted heads</tspan></text></g>
<g data-lane="floor"><rect x="10" y="368" width="854" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="393"><tspan class="lh" fill="#ff8a3d">THE FLOOR</tspan><tspan class="ln" dx="12">the honest floor</tspan></text></g>
<g data-edge="sentence->engine"><path class="e" d="M260,108 439,108 439,232" stroke="#69718a" marker-end="url(#tetris-flow-raw-a0)"/></g>
<g data-edge="engine->play"><path class="e" d="M554,286 618,286" stroke="#69718a" marker-end="url(#tetris-flow-raw-a0)"/></g>
<g data-edge="engine->abstain"><path class="e" d="M439,340 439,464 618,464" stroke="#69718a" marker-end="url(#tetris-flow-raw-a0)"/></g>
<g data-step="sentence" data-n="1"><rect class="gf-cb" x="30" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="52" cy="78" r="12" fill="#ff8a3d"/><text x="52" y="82.5" text-anchor="middle" class="n">1</text><text x="74" y="83" class="t">The same sentence</text><text x="46" y="109" class="d">the spot sentence, sent to the</text><text x="46" y="128" class="d">bare engine</text><circle cx="50" cy="146" r="4" fill="#4ade80"/><text x="60" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="engine" data-n="2"><rect class="gf-cb" x="324" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="346" cy="256" r="12" fill="#ff8a3d"/><text x="346" y="260.5" text-anchor="middle" class="n">2</text><text x="368" y="261" class="t">Corpus engine</text><text x="340" y="287" class="d">no fitted heads — nearest</text><text x="340" y="306" class="d">corpus neighbours only</text><circle cx="344" cy="324" r="4" fill="#4ade80"/><text x="354" y="328" class="s" fill="#4ade80">live</text></g>
<g data-step="play" data-n="3a"><rect class="gf-cb" x="618" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="628" y="244" width="29.6" height="24" rx="12" fill="#ff8a3d"/><text x="642.8" y="260.5" text-anchor="middle" class="n">3a</text><text x="667.6" y="261" class="t">In corpus → play</text><text x="634" y="287" class="d">a known shape: the highest</text><text x="634" y="306" class="d">neighbour wins</text><circle cx="638" cy="324" r="4" fill="#4ade80"/><text x="648" y="328" class="s" fill="#4ade80">live</text></g>
<g data-step="abstain" data-n="3b"><rect class="gf-cb" x="618" y="410" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="628" y="422" width="30.4" height="24" rx="12" fill="#ff8a3d"/><text x="643.2" y="438.5" text-anchor="middle" class="n">3b</text><text x="668.4" y="439" class="t">Abstain → random</text><text x="634" y="465" class="d">no close neighbour: a labelled</text><text x="634" y="484" class="d">random spot plays</text><circle cx="638" cy="502" r="4" fill="#4ade80"/><text x="648" y="506" class="s" fill="#4ade80">live</text></g>
</svg>
