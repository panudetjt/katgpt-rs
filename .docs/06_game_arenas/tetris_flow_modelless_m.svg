<svg xmlns="http://www.w3.org/2000/svg" id="tetris-flow-modelless-m" data-gfflow="1" viewBox="0 0 340 498" width="340" height="498" role="img" aria-labelledby="tetris-flow-modelless-m-t tetris-flow-modelless-m-d">
<title id="tetris-flow-modelless-m-t">Reflex · modelless: laya&#x27;s answers distilled into a µs head</title>
<desc id="tetris-flow-modelless-m-d">4 steps in path order. 1. The same sentence: the spot sentence laya reads, unchanged (the sentence; live). 2. Decode to features: holes · flat · height · side · clears, as numbers (the decode; live). 3. A tiny linear head: fitted on laya&#x27;s recorded answers — no model runs (the head; live). 4. Play the highest: microseconds in your tab; the top spot drops (the head; live).</desc>
<style>#tetris-flow-modelless-m .k{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}#tetris-flow-modelless-m .t{font:700 15.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#tetris-flow-modelless-m .d{font:400 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#tetris-flow-modelless-m .n{font:700 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#tetris-flow-modelless-m .s{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#tetris-flow-modelless-m .el{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab}#tetris-flow-modelless-m .e{fill:none;stroke-width:1.6}</style>
<defs><marker id="tetris-flow-modelless-m-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="340" height="498" rx="14" fill="#11141b"/>
<g data-step="sentence" data-n="1"><rect class="gf-cb" x="4" y="8" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="20" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="30" class="k" fill="#ff8a3d">THE SENTENCE</text><circle cx="280.2" cy="26" r="3.5" fill="#4ade80"/><text x="318" y="30" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="51" r="11" fill="#ff8a3d"/><text x="33" y="55.5" text-anchor="middle" class="n">1</text><text x="54" y="56" class="t">The same sentence</text><text x="22" y="80" class="d">the spot sentence laya reads, unchanged</text></g>
<g data-edge="sentence->decode"><path class="e" d="M44,94 V134" stroke="#69718a" marker-end="url(#tetris-flow-modelless-m-a0)"/>
</g>
<g data-step="decode" data-n="2"><rect class="gf-cb" x="4" y="134" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="146" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="156" class="k" fill="#ff8a3d">THE DECODE</text><circle cx="280.2" cy="152" r="3.5" fill="#4ade80"/><text x="318" y="156" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="177" r="11" fill="#ff8a3d"/><text x="33" y="181.5" text-anchor="middle" class="n">2</text><text x="54" y="182" class="t">Decode to features</text><text x="22" y="206" class="d">holes · flat · height · side · clears, as numbers</text></g>
<g data-edge="decode->head"><path class="e" d="M44,220 V260" stroke="#69718a" marker-end="url(#tetris-flow-modelless-m-a0)"/>
</g>
<g data-step="head" data-n="3"><rect class="gf-cb" x="4" y="260" width="332" height="104" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="272" width="4" height="80" rx="2" fill="#ff8a3d"/><text x="22" y="282" class="k" fill="#ff8a3d">THE HEAD</text><circle cx="280.2" cy="278" r="3.5" fill="#4ade80"/><text x="318" y="282" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="303" r="11" fill="#ff8a3d"/><text x="33" y="307.5" text-anchor="middle" class="n">3</text><text x="54" y="308" class="t">A tiny linear head</text><text x="22" y="332" class="d">fitted on laya&#x27;s recorded answers — no model</text><text x="22" y="350" class="d">runs</text></g>
<g data-edge="head->play"><path class="e" d="M44,364 V404" stroke="#69718a" marker-end="url(#tetris-flow-modelless-m-a0)"/>
</g>
<g data-step="play" data-n="4"><rect class="gf-cb" x="4" y="404" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="416" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="426" class="k" fill="#ff8a3d">THE HEAD</text><circle cx="280.2" cy="422" r="3.5" fill="#4ade80"/><text x="318" y="426" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="447" r="11" fill="#ff8a3d"/><text x="33" y="451.5" text-anchor="middle" class="n">4</text><text x="54" y="452" class="t">Play the highest</text><text x="22" y="476" class="d">microseconds in your tab; the top spot drops</text></g>
</svg>
