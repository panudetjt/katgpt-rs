<svg xmlns="http://www.w3.org/2000/svg" id="tetris-flow-rulebook-m" data-gfflow="1" viewBox="0 0 340 790" width="340" height="790" role="img" aria-labelledby="tetris-flow-rulebook-m-t tetris-flow-rulebook-m-d">
<title id="tetris-flow-rulebook-m-t">Reflex · rulebook: plan three pieces ahead, play one move</title>
<desc id="tetris-flow-rulebook-m-d">6 steps in path order. 1. Piece in play: every legal landing spot, listed (look ahead; live). 2. Preview chained: every spot for the next piece, best six kept (look ahead; live). 3. Third is unknown: branch over every piece left in the bag (look ahead; live). 4. Score end boards: the strategy rulebook judges each one (decide; live). 5. Average, then pick: over the unknown piece; sturdiest plan wins (decide; live). 6. Play move one: the first move lands; the search restarts (decide; live). From 6 back to 1: next piece.</desc>
<style>#tetris-flow-rulebook-m .k{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}#tetris-flow-rulebook-m .t{font:700 15.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#tetris-flow-rulebook-m .d{font:400 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#tetris-flow-rulebook-m .n{font:700 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#tetris-flow-rulebook-m .s{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#tetris-flow-rulebook-m .el{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab}#tetris-flow-rulebook-m .e{fill:none;stroke-width:1.6}</style>
<defs><marker id="tetris-flow-rulebook-m-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="340" height="790" rx="14" fill="#11141b"/>
<g data-step="fall" data-n="1"><rect class="gf-cb" x="4" y="8" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="20" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="30" class="k" fill="#ff8a3d">LOOK AHEAD · THREE PIECES DEEP</text><circle cx="280.2" cy="26" r="3.5" fill="#4ade80"/><text x="318" y="30" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="51" r="11" fill="#ff8a3d"/><text x="33" y="55.5" text-anchor="middle" class="n">1</text><text x="54" y="56" class="t">Piece in play</text><text x="22" y="80" class="d">every legal landing spot, listed</text></g>
<g data-edge="fall->preview"><path class="e" d="M44,94 V134" stroke="#69718a" marker-end="url(#tetris-flow-rulebook-m-a0)"/>
</g>
<g data-step="preview" data-n="2"><rect class="gf-cb" x="4" y="134" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="146" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="156" class="k" fill="#ff8a3d">LOOK AHEAD · THREE PIECES DEEP</text><circle cx="280.2" cy="152" r="3.5" fill="#4ade80"/><text x="318" y="156" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="177" r="11" fill="#ff8a3d"/><text x="33" y="181.5" text-anchor="middle" class="n">2</text><text x="54" y="182" class="t">Preview chained</text><text x="22" y="206" class="d">every spot for the next piece, best six kept</text></g>
<g data-edge="preview->bag"><path class="e" d="M44,220 V260" stroke="#69718a" marker-end="url(#tetris-flow-rulebook-m-a0)"/>
</g>
<g data-step="bag" data-n="3"><rect class="gf-cb" x="4" y="260" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="272" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="282" class="k" fill="#ff8a3d">LOOK AHEAD · THREE PIECES DEEP</text><circle cx="280.2" cy="278" r="3.5" fill="#4ade80"/><text x="318" y="282" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="303" r="11" fill="#ff8a3d"/><text x="33" y="307.5" text-anchor="middle" class="n">3</text><text x="54" y="308" class="t">Third is unknown</text><text x="22" y="332" class="d">branch over every piece left in the bag</text></g>
<g data-edge="bag->score"><path class="e" d="M44,346 V386" stroke="#69718a" marker-end="url(#tetris-flow-rulebook-m-a0)"/>
</g>
<g data-step="score" data-n="4"><rect class="gf-cb" x="4" y="386" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="398" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="408" class="k" fill="#ff8a3d">DECIDE · SCORE</text><circle cx="280.2" cy="404" r="3.5" fill="#4ade80"/><text x="318" y="408" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="429" r="11" fill="#ff8a3d"/><text x="33" y="433.5" text-anchor="middle" class="n">4</text><text x="54" y="434" class="t">Score end boards</text><text x="22" y="458" class="d">the strategy rulebook judges each one</text></g>
<g data-edge="score->average"><path class="e" d="M44,472 V512" stroke="#69718a" marker-end="url(#tetris-flow-rulebook-m-a0)"/>
</g>
<g data-step="average" data-n="5"><rect class="gf-cb" x="4" y="512" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="524" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="534" class="k" fill="#ff8a3d">DECIDE · SCORE</text><circle cx="280.2" cy="530" r="3.5" fill="#4ade80"/><text x="318" y="534" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="555" r="11" fill="#ff8a3d"/><text x="33" y="559.5" text-anchor="middle" class="n">5</text><text x="54" y="560" class="t">Average, then pick</text><text x="22" y="584" class="d">over the unknown piece; sturdiest plan wins</text></g>
<g data-edge="average->play"><path class="e" d="M44,598 V638" stroke="#69718a" marker-end="url(#tetris-flow-rulebook-m-a0)"/>
</g>
<g data-step="play" data-n="6"><rect class="gf-cb" x="4" y="638" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="650" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="660" class="k" fill="#ff8a3d">DECIDE · SCORE</text><circle cx="280.2" cy="656" r="3.5" fill="#4ade80"/><text x="318" y="660" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="681" r="11" fill="#ff8a3d"/><text x="33" y="685.5" text-anchor="middle" class="n">6</text><text x="54" y="686" class="t">Play move one</text><text x="22" y="710" class="d">the first move lands; the search restarts</text></g>
<g data-edge="play->fall"><rect x="4" y="742" width="332" height="40" rx="12" fill="#ff8a3d" fill-opacity=".08" stroke="#ff8a3d" stroke-opacity=".5" stroke-dasharray="4 4"/><text x="22" y="768" class="el" style="fill:#ff8a3d">↺ from 6 back to step 1 · next piece</text></g>
</svg>
