<svg xmlns="http://www.w3.org/2000/svg" id="tetris-flow-rulebook" data-gfflow="1" viewBox="0 0 874 368" width="874" height="368" role="img" aria-labelledby="tetris-flow-rulebook-t tetris-flow-rulebook-d">
<title id="tetris-flow-rulebook-t">Reflex · rulebook: plan three pieces ahead, play one move</title>
<desc id="tetris-flow-rulebook-d">6 steps in path order. 1. Piece in play: every legal landing spot, listed (look ahead; live). 2. Preview chained: every spot for the next piece, best six kept (look ahead; live). 3. Third is unknown: branch over every piece left in the bag (look ahead; live). 4. Score end boards: the strategy rulebook judges each one (decide; live). 5. Average, then pick: over the unknown piece; sturdiest plan wins (decide; live). 6. Play move one: the first move lands; the search restarts (decide; live). From 6 back to 1: next piece.</desc>
<style>#tetris-flow-rulebook .lh{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}#tetris-flow-rulebook .ln{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#9299ab}#tetris-flow-rulebook .at{font:600 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#tetris-flow-rulebook .t{font:700 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#tetris-flow-rulebook .d{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#tetris-flow-rulebook .n{font:700 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#tetris-flow-rulebook .s{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#tetris-flow-rulebook .el{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab;paint-order:stroke;stroke:#11141b;stroke-width:4px;stroke-linejoin:round}#tetris-flow-rulebook .e{fill:none;stroke-width:1.6}#tetris-flow-rulebook .eb{fill:none;stroke-width:2}</style>
<defs><marker id="tetris-flow-rulebook-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker><marker id="tetris-flow-rulebook-a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff8a3d"/></marker></defs>
<rect width="874" height="368" rx="14" fill="#11141b"/>
<g data-lane="look"><rect x="10" y="12" width="854" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="37"><tspan class="lh" fill="#ff8a3d">LOOK AHEAD</tspan><tspan class="ln" dx="12">three pieces deep</tspan></text></g>
<g data-lane="decide"><rect x="10" y="190" width="854" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="215"><tspan class="lh" fill="#ff8a3d">DECIDE</tspan><tspan class="ln" dx="12">score · average · pick</tspan></text></g>
<g data-edge="fall->preview"><path class="e" d="M260,108 324,108" stroke="#69718a" marker-end="url(#tetris-flow-rulebook-a0)"/></g>
<g data-edge="preview->bag"><path class="e" d="M554,108 618,108" stroke="#69718a" marker-end="url(#tetris-flow-rulebook-a0)"/></g>
<g data-edge="bag->score"><path class="e" d="M733,162 733,232" stroke="#69718a" marker-end="url(#tetris-flow-rulebook-a0)"/></g>
<g data-edge="score->average"><path class="e" d="M618,286 554,286" stroke="#69718a" marker-end="url(#tetris-flow-rulebook-a0)"/></g>
<g data-edge="average->play"><path class="e" d="M324,286 260,286" stroke="#69718a" marker-end="url(#tetris-flow-rulebook-a0)"/></g>
<g data-edge="play->fall"><path class="eb" d="M145,232 145,162" stroke="#ff8a3d" marker-end="url(#tetris-flow-rulebook-a1)"/><text class="el" x="155" y="187" text-anchor="start" style="fill:#ff8a3d">next piece</text></g>
<g data-step="fall" data-n="1"><rect class="gf-cb" x="30" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="52" cy="78" r="12" fill="#ff8a3d"/><text x="52" y="82.5" text-anchor="middle" class="n">1</text><text x="74" y="83" class="t">Piece in play</text><text x="46" y="109" class="d">every legal landing spot, listed</text><circle cx="50" cy="146" r="4" fill="#4ade80"/><text x="60" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="preview" data-n="2"><rect class="gf-cb" x="324" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="346" cy="78" r="12" fill="#ff8a3d"/><text x="346" y="82.5" text-anchor="middle" class="n">2</text><text x="368" y="83" class="t">Preview chained</text><text x="340" y="109" class="d">every spot for the next piece,</text><text x="340" y="128" class="d">best six kept</text><circle cx="344" cy="146" r="4" fill="#4ade80"/><text x="354" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="bag" data-n="3"><rect class="gf-cb" x="618" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="640" cy="78" r="12" fill="#ff8a3d"/><text x="640" y="82.5" text-anchor="middle" class="n">3</text><text x="662" y="83" class="t">Third is unknown</text><text x="634" y="109" class="d">branch over every piece left in</text><text x="634" y="128" class="d">the bag</text><circle cx="638" cy="146" r="4" fill="#4ade80"/><text x="648" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="score" data-n="4"><rect class="gf-cb" x="618" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="640" cy="256" r="12" fill="#ff8a3d"/><text x="640" y="260.5" text-anchor="middle" class="n">4</text><text x="662" y="261" class="t">Score end boards</text><text x="634" y="287" class="d">the strategy rulebook judges</text><text x="634" y="306" class="d">each one</text><circle cx="638" cy="324" r="4" fill="#4ade80"/><text x="648" y="328" class="s" fill="#4ade80">live</text></g>
<g data-step="average" data-n="5"><rect class="gf-cb" x="324" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="346" cy="256" r="12" fill="#ff8a3d"/><text x="346" y="260.5" text-anchor="middle" class="n">5</text><text x="368" y="261" class="t">Average, then pick</text><text x="340" y="287" class="d">over the unknown piece;</text><text x="340" y="306" class="d">sturdiest plan wins</text><circle cx="344" cy="324" r="4" fill="#4ade80"/><text x="354" y="328" class="s" fill="#4ade80">live</text></g>
<g data-step="play" data-n="6"><rect class="gf-cb" x="30" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="52" cy="256" r="12" fill="#ff8a3d"/><text x="52" y="260.5" text-anchor="middle" class="n">6</text><text x="74" y="261" class="t">Play move one</text><text x="46" y="287" class="d">the first move lands; the</text><text x="46" y="306" class="d">search restarts</text><circle cx="50" cy="324" r="4" fill="#4ade80"/><text x="60" y="328" class="s" fill="#4ade80">live</text></g>
</svg>
